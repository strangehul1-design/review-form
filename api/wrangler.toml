name = "digital-reviews"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Сайты, с которых принимаются отзывы. Чужой сайт слать не сможет.
# Портфолио и отдельная страница формы живут на одном адресе GitHub Pages.
ALLOWED_ORIGINS = "https://strangehul1-design.github.io"

# ─────────────────────────────────────────────────────────────
# Секретов здесь НЕТ и быть не должно — файл лежит в репозитории.
# Ключи задаются командой `wrangler secret put ИМЯ`:
#
#   TELEGRAM_BOT_TOKEN   токен бота от @BotFather
#   TELEGRAM_CHAT_ID     куда слать отзывы (узнать у @userinfobot);
#                        несколько чатов — через запятую
# ─────────────────────────────────────────────────────────────
